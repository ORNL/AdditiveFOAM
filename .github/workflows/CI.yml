name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  CI:
    name: OpenFOAM 13
    runs-on: ubuntu-latest

    container:
      image: docker.io/microfluidica/openfoam:13
      options: --user root

    defaults:
      run:
        shell: bash -e -o pipefail {0}

    steps:
      - name: Checkout AdditiveFOAM
        uses: actions/checkout@v6

      - name: Show OpenFOAM version
        run: |
          . /opt/openfoam13/etc/bashrc
          echo "WM_PROJECT=${WM_PROJECT}"
          echo "WM_PROJECT_VERSION=${WM_PROJECT_VERSION}"
          echo "WM_PROJECT_DIR=${WM_PROJECT_DIR}"
          which blockMesh
          which wmake

      - name: Build AdditiveFOAM
        run: |
          . /opt/openfoam13/etc/bashrc
          ./Allwmake

      - name: Test AdditiveFOAM
        run: |
          . /opt/openfoam13/etc/bashrc
          cp -r tutorials/AMB2018-02-B userCase
          cd userCase
          blockMesh
          decomposePar
          mpirun -n 6 --oversubscribe --allow-run-as-root additiveFoam -parallel
